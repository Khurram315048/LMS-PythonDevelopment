<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Teacher Portal{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/teachers_module.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/teachers_module.css') }}">
    <link rel="icon" type="image/jpg" href="{{ url_for('static', filename='images/logo.jpg') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
   
    <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
</head>
<body>
    <header class="main-header">
    <div class="header-left">
        <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="ISP Logo" class="logo">
        <h1 class="tchr_text">Teacher Management System</h1>
    </div>
    <a href="{{ url_for('logout') }}" class="logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span>
    </a>
</header>
    
    <div class="main-wrapper">
        <nav class="sidebar">
            <ul>
                <li><a href="{{ url_for('teacher.teacher_profile') }}"><i class="fa-solid fa-user"></i> <span>Profile</span></a></li>
                <li><a href="{{ url_for('teacher.teacher_dashboard') }}"><i class="fa-solid fa-chart-line"></i> <span>Dashboard</span></a></li> 
                <li><a href="{{ url_for('teacher.class_attendance') }}"><i class="fa-solid fa-calendar-check"> </i> <span>Class Attendance</span></a></li> 
                <li><a href="#"><i class="fa-solid fa-square-poll-vertical"></i><span>Survey Perfoma</span></a></li>
                <li><a href="{{ url_for('teacher.fyp_management')}}"><i class="fa-solid fa-user-tie"></i><span>FYP Supervisor</span></a></li>
                <li><a href="{{ url_for('logout') }}" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></a></li>
            </ul>
        </nav>
        
        <main class="content-area">
            {% block content %}{% endblock %}
            {% block scripts %}{% endblock %} 
        </main>
    </div>
   
    
</body>

</html>
